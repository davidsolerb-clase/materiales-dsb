<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dentro del ordenador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0F2A22; --board-2:#163A2E; --board-3:#1D4738;
  --trace:#2F6B53; --copper:#E0A458; --copper-ink:#2A1A06;
  --silk:#EEF5EF; --muted:#A3BFB1; --ok:#74DB9F; --bad:#FF8574;
  --focus:#F4CF5D; --plate:#F3F6F1; --plate-ink:#17352A;
  --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --board:#E9F1EB; --board-2:#FFFFFF; --board-3:#F4F8F5;
    --trace:#B5D0C1; --copper:#A85F18; --copper-ink:#FFFFFF;
    --silk:#10261C; --muted:#4D6A5C; --ok:#1C8648; --bad:#C1352A;
    --focus:#B07A00; --plate:#F3F6F1; --plate-ink:#17352A;
    --shadow:rgba(16,38,28,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --board:#E9F1EB; --board-2:#FFFFFF; --board-3:#F4F8F5;
  --trace:#B5D0C1; --copper:#A85F18; --copper-ink:#FFFFFF;
  --silk:#10261C; --muted:#4D6A5C; --ok:#1C8648; --bad:#C1352A;
  --focus:#B07A00; --shadow:rgba(16,38,28,.12); color-scheme:light;
}
:root[data-theme="dark"]{
  --board:#0F2A22; --board-2:#163A2E; --board-3:#1D4738;
  --trace:#2F6B53; --copper:#E0A458; --copper-ink:#2A1A06;
  --silk:#EEF5EF; --muted:#A3BFB1; --ok:#74DB9F; --bad:#FF8574;
  --focus:#F4CF5D; --shadow:rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  background-color:var(--board);
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--trace) 55%, transparent) 1.2px, transparent 1.6px);
  background-size:28px 28px;
  color:var(--silk);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.0625rem; line-height:1.5;
}
h1,h2,h3,.disp{font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button:disabled{cursor:not-allowed}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 48px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.8em 1.3em;border-radius:10px;border:2px solid var(--trace);
  background:var(--board-2);font-weight:700;transition:transform .12s,border-color .15s,background .15s;
}
.btn:hover:not(:disabled){border-color:var(--copper)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--copper-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent}
.btn.small{padding:.45em .9em;font-size:.92rem}

/* ---------- Home ---------- */
.hero{position:relative;padding:40px 0 28px;overflow:hidden}
.hero svg.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.traces path{fill:none;stroke:var(--trace);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.traces circle{fill:var(--board);stroke:var(--copper);stroke-width:3}
.traces .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-inner{position:relative;max-width:620px}
@media (max-width:900px){.hero svg.traces{opacity:.35}}
.chipmark{display:inline-flex;align-items:center;gap:10px;font-family:"Chakra Petch",sans-serif;font-weight:600;color:var(--copper);font-size:1rem;margin-bottom:14px}
.chipmark i{width:30px;height:22px;border:2px solid var(--copper);border-radius:3px;position:relative}
.chipmark i::before,.chipmark i::after{content:"";position:absolute;left:4px;right:4px;height:0;border-top:2px dotted var(--copper)}
.chipmark i::before{top:-6px}.chipmark i::after{bottom:-6px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-.01em}
.hero p{font-size:1.15rem;max-width:34em;margin:16px 0 0;color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:26px}
.mode{
  background:var(--board-2);border:2px solid var(--trace);border-radius:14px;padding:22px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px var(--shadow);
}
.mode.hard{border-style:dashed;border-color:var(--copper)}
.mode h2{font-size:1.65rem}
.mode .blurb{margin:0;color:var(--muted)}
.pads{display:flex;flex-wrap:wrap;gap:7px}
.pad{width:20px;height:20px;border-radius:50%;border:2px solid var(--trace);background:transparent;position:relative}
.pad.s1{background:color-mix(in srgb,var(--copper) 30%,transparent)}
.pad.s2{background:color-mix(in srgb,var(--copper) 62%,transparent)}
.pad.s3{background:var(--copper);border-color:var(--copper)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--silk)}
.spark{display:flex;align-items:flex-end;gap:5px;height:42px}
.spark span{flex:0 0 14px;background:var(--trace);border-radius:3px 3px 0 0;min-height:4px}
.spark span:last-child{background:var(--copper)}
.plan-note{font-size:.95rem;border-left:3px solid var(--copper);padding:4px 0 4px 10px;margin:0}

.how{margin-top:40px}
.how h2{font-size:1.35rem;margin-bottom:14px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.path li{counter-increment:s;background:var(--board-3);border-radius:12px;padding:16px 16px 16px 58px;position:relative;min-height:84px}
.path li::before{content:counter(s);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;border:2px solid var(--copper);display:grid;place-items:center;font-family:"Chakra Petch",sans-serif;font-weight:700;color:var(--copper)}
.path b{display:block;font-family:"Chakra Petch",sans-serif;font-size:1.08rem;margin-bottom:2px}
.path span{color:var(--muted);font-size:.95rem}
.foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}

/* ---------- Game header / stepper ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar .brand{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.05rem}
.topbar .tag{font-size:.85rem;border:1.5px solid var(--copper);color:var(--copper);border-radius:999px;padding:2px 10px}
.topbar .sp{flex:1}
.stepper{display:flex;align-items:center;list-style:none;margin:0 0 22px;padding:0;overflow-x:auto}
.stepper li{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);font-size:.92rem}
.stepper li+li::before{content:"";width:clamp(14px,4vw,46px);height:3px;background:var(--trace);border-radius:2px;margin:0 8px}
.stepper .dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--trace);flex:none}
.stepper li.done .dot{background:var(--copper);border-color:var(--copper)}
.stepper li.done::before{background:var(--copper)}
.stepper li.now{color:var(--silk);font-weight:700}
.stepper li.now .dot{border-color:var(--copper);box-shadow:0 0 0 4px color-mix(in srgb,var(--copper) 30%,transparent)}

/* ---------- Study ---------- */
.study{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start;background:var(--board-2);border:2px solid var(--trace);border-radius:16px;padding:24px;box-shadow:0 10px 30px var(--shadow)}
.plate{background:var(--plate);border-radius:12px;display:grid;place-items:center;overflow:hidden;color:var(--plate-ink)}
.plate img{display:block;width:100%;height:100%;object-fit:contain}
.plate svg{width:86%;height:86%}
.study .plate{aspect-ratio:4/3}
.study h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:6px}
.counter{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.newbadge{display:inline-block;font-size:.8rem;font-weight:700;background:var(--copper);color:var(--copper-ink);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.q{font-size:1.15rem;margin:18px 0 12px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choices .btn{flex:1 1 130px}
.def{font-size:1.3rem;line-height:1.5;margin:16px 0 0;padding:14px 16px;border-left:4px solid var(--copper);background:var(--board-3);border-radius:0 10px 10px 0}
.hint{margin:14px 0 0;color:var(--muted)}
.hint strong{color:var(--silk)}
.mypred{font-size:.9rem;color:var(--muted);margin-top:10px}
.gate{position:relative;overflow:hidden}
.gate .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--copper) 35%,transparent);transition:width linear}
.gate span{position:relative}
.studynav{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap}
.progress-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.progress-dots i{width:10px;height:10px;border-radius:50%;background:var(--trace)}
.progress-dots i.on{background:var(--copper)}

/* ---------- Match ---------- */
.roundhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin-bottom:16px}
.roundhead h2{font-size:clamp(1.5rem,3.5vw,2rem)}
.roundhead p{margin:4px 0 0;color:var(--muted)}
.roundhead .count{margin-left:auto;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:1.1rem}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.side{display:grid;gap:10px;align-content:start}
.side.k-img{grid-template-columns:repeat(3,minmax(0,1fr))}
.side.k-name{grid-template-columns:repeat(2,minmax(0,1fr))}
.item{
  position:relative;text-align:left;border:2px solid var(--trace);background:var(--board-2);
  border-radius:10px;padding:12px 14px;min-height:56px;display:flex;align-items:center;gap:10px;
  transition:border-color .15s,transform .12s,box-shadow .15s;
}
.item:hover:not(:disabled){border-color:var(--copper)}
.item.k-name{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:1.05rem;justify-content:center;text-align:center}
.item.k-def{font-size:1rem;line-height:1.4}
.item.k-img{padding:6px;flex-direction:column;align-items:stretch;min-height:0}
.item.k-img .plate{aspect-ratio:4/3;width:100%}
.item.sel{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 30%,transparent);transform:translateY(-2px)}
.item .tagc{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.9rem;color:#14261D;border:2px solid rgba(0,0,0,.25)}
.item.k-img .tagc{position:absolute;top:10px;left:10px}
.item.linked{border-width:3px}
.item.locked{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--board-2))}
.item.locked .tagc{background:var(--ok)!important;color:#08210F}
.item.wrong{border-color:var(--bad);animation:shake .45s}
.item.retry{border:2px dashed var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--board-2))}
.item{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item img,.item svg,.item .plate{pointer-events:none;-webkit-user-drag:none;user-select:none}
.pendingmsg{margin:10px 4px 0;font-weight:700;color:var(--bad)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55)}
.modal .box{background:var(--board-2);border:2px solid var(--copper);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 30px var(--shadow)}
.modal p{margin:0 0 16px;font-size:1.1rem}
.modal .row2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.checkbar{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--board-2);border:2px solid var(--trace);border-radius:14px;padding:14px 16px}
.checkbar .lbl{font-weight:700;margin-right:4px}
.checkbar .grp{display:flex;flex-wrap:wrap;gap:8px}
.checkbar .sp{flex:1}
.feedback{margin-top:18px;border-radius:14px;padding:16px 18px;background:var(--board-3);border:2px solid var(--trace)}
.feedback.bad{border-color:var(--bad)}
.feedback.good{border-color:var(--ok)}
.feedback h3{font-size:1.2rem;margin-bottom:8px}
.feedback ul{margin:8px 0 0;padding-left:1.1em}
.feedback li{margin:6px 0}
.feedback li .was{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--copper);color:var(--copper-ink);font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px var(--shadow);z-index:20;max-width:min(92vw,520px);text-align:center}

/* ---------- Reflect ---------- */
.score{display:flex;flex-wrap:wrap;gap:14px 36px;align-items:baseline;margin:8px 0 22px}
.score .big{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5rem);line-height:1;color:var(--copper)}
.score .meta{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;align-items:start}
.panel{background:var(--board-2);border:2px solid var(--trace);border-radius:14px;padding:18px}
.panel h3{font-size:1.25rem;margin-bottom:10px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--trace) 60%,transparent)}
.row:last-child{border-bottom:0}
.row .plate{width:52px;height:40px}
.row .nm{font-weight:700}
.row .pr{font-size:.82rem;color:var(--muted)}
.marks{display:flex;gap:4px}
.marks i{width:14px;height:14px;border-radius:3px;background:var(--ok)}
.marks i.x{background:var(--bad)}
.stars{font-family:"Chakra Petch",sans-serif;color:var(--copper);letter-spacing:1px;min-width:3.4em;text-align:right}
.stars .off{color:var(--trace)}
.insight{margin:0 0 12px}
.insight:last-child{margin-bottom:0}
.plans{display:grid;gap:8px;margin-top:10px}
.plans .btn{justify-content:flex-start;text-align:left}
.plans .btn[aria-pressed="true"]{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 18%,var(--board-2))}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--ok);display:inline-block}
.legend i.x{background:var(--bad)}
.mastery-banner{background:var(--copper);color:var(--copper-ink);border-radius:14px;padding:16px 18px;margin-bottom:20px;font-weight:700}

.selbar{display:none}
@media (max-width:640px){
  .selbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;align-items:center;gap:10px;background:var(--board-2);border:2px solid var(--focus);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px var(--shadow);font-size:.95rem}
  .selbar span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .topbar .brand{display:none}
  .wrap.has-sel{padding-bottom:110px}
}
/* ---------- Responsive ---------- */
@media (max-width:820px){
  .study{grid-template-columns:1fr;padding:18px}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .board{grid-template-columns:1fr}
  .side.k-img{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item.k-img .tagc{width:24px;height:24px;top:8px;left:8px}
  .def{font-size:1.15rem}
  .row{grid-template-columns:44px minmax(0,1fr) auto;}
  .row .stars{grid-column:2 / 4;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .traces .draw{stroke-dashoffset:0}
}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

  if(!s||!s.modes) s={modes:{}};
  for(const m of Object.keys(MODES)){
    if(!s.modes[m]) s.modes[m]={stars:{},history:[],plan:''};
  }
  return s;
}
let store = loadStore();
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pic = id => { const c=C[id]; return c.img ? `<img src="${IMG[c.img]}" alt="Foto: ${c.svg?'':'componente'}" loading="lazy">` : SVG[c.svg]; };
const picAlt = (id, hide) => { const c=C[id]; if(c.img) return `<img src="${IMG[c.img]}" alt="${hide?'Foto de un componente':'Foto: '+c.name}">`; return SVG[c.svg]; };
const words = t => t.split(/\s+/).length;
const starStr = n => `${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span>`;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3800);
}

/* ---------- State ---------- */
let S = {phase:'home'};

function startMode(m){
  const ids = shuffle(MODES[m].ids);
  S = {
    phase:'study', mode:m, ids, si:0, stage:'predict', pred:{}, gateTimer:null,
    round:0, links:{}, locked:{}, undo:[], sel:null, firstDone:false, results:[{},{},{}], conf:[null,null,null],
    orderA:[], orderB:[], lastLink:0, fast:0, feedback:null, t0:Date.now(), committed:false, planChoice:null
  };
  render(); window.scrollTo(0,0);
}

/* ---------- Render: router ---------- */
function render(){
  document.getElementById('toast').hidden=true; $app.classList.remove('has-sel');
  if(S.phase==='home') renderHome();
  else if(S.phase==='study') renderStudy();
  else if(S.phase==='match') renderMatch();
  else if(S.phase==='reflect') renderReflect();
}

function stepper(){
  const steps=['Estudia','Ronda 1','Ronda 2','Ronda 3','Reflexiona'];
  const cur = S.phase==='study'?0 : S.phase==='match'?S.round+1 : 4;
  return `<ol class="stepper" aria-label="Progreso">${steps.map((s,i)=>`<li class="${i<cur?'done':i===cur?'now':''}" ${i===cur?'aria-current="step"':''}><span class="dot"></span>${s}</li>`).join('')}</ol>`;
}
function topbar(){
  return `<div class="topbar"><span class="brand">Dentro del ordenador</span><span class="tag">${MODES[S.mode].title}</span><span class="sp"></span><button class="btn small ghost" data-act="home">Salir</button></div>${stepper()}`;
}

/* ---------- Study ---------- */

/* ---------- Match ---------- */
function setupRound(){
  const r=ROUNDS[S.round];
  S.links={}; S.locked={}; S.undo=[]; S.sel=null; S.firstDone=false; S.feedback=null; S.fast=0; S.lastLink=Date.now(); S.retry=[]; S.retryB=[];
  S.orderA=shuffle(S.ids); S.orderB=shuffle(S.ids);
}
function colorFor(aId){ return PALETTE[S.orderA.indexOf(aId)%PALETTE.length]; }
function numFor(aId){ return S.orderA.indexOf(aId)+1; }
function bLinkedTo(bId){ return Object.keys(S.links).find(a=>S.links[a]===bId); }

function itemHTML(side, kind, id){
  const r=ROUNDS[S.round];
  const aId = side==='a' ? id : bLinkedTo(id);
  const linked = side==='a' ? (id in S.links) : !!aId;
  const locked = side==='a' ? S.locked[id] : (aId && S.locked[aId]);
  const sel = S.sel && S.sel.side===side && S.sel.id===id;
  const wrong = S.wrongFlash && (side==='a' ? S.wrongFlash.a.includes(id) : S.wrongFlash.b.includes(id));
  const retry = !linked && !locked && (side==='a' ? (S.retry||[]).includes(id) : (S.retryB||[]).includes(id));
  let body = kind==='img' ? `<div class="plate">${picAlt(id,true)}</div>` : kind==='name' ? `<span>${C[id].name}</span>` : `<span>${C[id].def}</span>`;
  const tag = linked ? `<span class="tagc" style="background:${colorFor(aId)}" aria-hidden="true">${locked?'✓':numFor(aId)}</span>` : '';
  const label = (kind==='img' ? 'Foto' : kind==='name' ? C[id].name : C[id].def) + (locked?' (correcto)':linked?' (unido al '+numFor(aId)+')':'');
  return `<button class="item k-${kind} ${sel?'sel':''} ${linked?'linked':''} ${locked?'locked':''} ${wrong?'wrong':''} ${retry?'retry':''}"
    style="${linked&&!locked?`border-color:${colorFor(aId)}`:''}" data-act="pick" data-side="${side}" data-id="${id}"
    ${locked?'disabled':''} aria-pressed="${sel}" aria-label="${label.replace(/"/g,'&quot;')}">${kind==='img'?tag+body:tag+body}</button>`;
}

function renderMatch(){
  const r=ROUNDS[S.round], n=S.ids.length;
  const done = Object.keys(S.locked).length===n;
  const pending = S.ids.filter(id=>!S.locked[id]);
  const allLinked = pending.every(id=>id in S.links);
  const linkedCount = Object.keys(S.links).length;
  const firstScore = S.firstDone ? Object.values(S.results[S.round]).filter(Boolean).length : null;

  $app.innerHTML = `${topbar()}
    <div class="roundhead">
      <div><h2>${r.title}</h2><p>${r.instr}</p></div>
      <div class="count">${done?`${firstScore}/${n} a la primera`:`Unidas: ${linkedCount}/${n}`}</div>
    </div>
    <div class="board">
      <div class="side k-${r.a}" role="group" aria-label="Columna A">${S.orderA.map(id=>itemHTML('a',r.a,id)).join('')}</div>
      <div class="side k-${r.b}" role="group" aria-label="Columna B">${S.orderB.map(id=>itemHTML('b',r.b,id)).join('')}</div>
    </div>
    ${S.feedback ? S.feedback : ''}
    ${S.sel ? `<div class="selbar" role="status"><span><b>Seleccionado:</b> ${selText()}</span><button class="btn small" data-act="unsel">Cancelar</button></div>`:''}
    ${done ? `
      <div class="checkbar"><span>Ronda completada. ${firstScore===n?'¡Todas bien a la primera!':`Has corregido tus fallos: ${n-firstScore} que repasar.`}</span><span class="sp"></span>
      <button class="btn primary" data-act="nextround">${S.round<2?'Siguiente ronda':'Ver mis resultados'}</button></div>` : `
      <div class="checkbar">
        <button class="btn small ghost" data-act="undo" ${S.undo.length?'':'disabled'}>Deshacer</button>
        <span class="sp"></span>
        ${!S.firstDone ? `<span class="lbl">¿Cómo de seguro estás?</span>
        <div class="grp">${Object.entries(CONF).map(([k,v])=>`<button class="btn small" data-act="check" data-c="${k}" ${allLinked?'':'disabled'}>${v}</button>`).join('')}</div>`
        : `<button class="btn primary" data-act="check" data-c="" ${allLinked?'':'disabled'}>Comprobar de nuevo</button>`}
      </div>
      ${!allLinked && !S.firstDone ? `<p class="muted" style="font-size:.92rem;margin:8px 4px 0">Une todas las parejas para poder comprobar. Elegir lo seguro que estás también cuenta: lo veremos al final.</p>`:''}
      ${!allLinked && S.firstDone ? `<p class="pendingmsg">Te ${pending.filter(id=>!(id in S.links)).length===1?'falta 1 pareja':'faltan '+pending.filter(id=>!(id in S.links)).length+' parejas'} por volver a unir: están marcadas en rojo. Cuando las unas, pulsa «Comprobar de nuevo».</p>`:''}`}`;
  S.wrongFlash=null;
  $app.classList.toggle('has-sel', !!S.sel);
}
function selText(){
  const r=ROUNDS[S.round], kind = S.sel.side==='a'?r.a:r.b, c=C[S.sel.id];
  return kind==='img' ? 'una foto. Ahora toca su pareja.' : kind==='name' ? c.name+'. Ahora toca su pareja.' : '«'+c.def+'»';
}
const isNarrow = () => window.matchMedia('(max-width:640px)').matches;
function scrollToSide(side){
  const el=document.querySelectorAll('.side')[side==='a'?0:1];
  if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'});
}

function pick(side,id){
  const r=ROUNDS[S.round];
  if(!S.sel || S.sel.side===side){
    S.sel = (S.sel && S.sel.side===side && S.sel.id===id) ? null : {side,id};
    renderMatch();
    if(S.sel && isNarrow()) scrollToSide(side==='a'?'b':'a');
    return;
  }
  const aId = side==='a'?id:S.sel.id, bId = side==='b'?id:S.sel.id;
  S.undo.push({...S.links});
  for(const k of Object.keys(S.links)) if(S.links[k]===bId) delete S.links[k];
  S.links[aId]=bId; S.sel=null;
  // Lectura: avisar si se une demasiado rápido en rondas con definiciones
  if(r.a==='def'||r.b==='def'){
    const now=Date.now();
    if(now-S.lastLink<2200) S.fast++; else S.fast=0;
    S.lastLink=now;
    if(S.fast>=2){ toast('Vas muy rápido. Lee la definición entera antes de unir: así se aprende de verdad.'); S.fast=0; }
  }
  renderMatch();
  if(isNarrow()){
    const next=S.orderA.find(x=>!(x in S.links)&&!S.locked[x]);
    const el=next&&document.querySelector(`[data-side=a][data-id=${next}]`);
    if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'center'});
  }
}

function check(conf){
  const r=ROUNDS[S.round];
  const wrongA=[], wrongB=[], wrongList=[];
  for(const a of S.ids){
    if(S.locked[a]) continue;
    const b=S.links[a];
    const ok = a===b;
    if(!S.firstDone) S.results[S.round][a]=ok;
    if(ok) S.locked[a]=true;
    else { wrongA.push(a); wrongB.push(b); wrongList.push([a,b]); }
  }
  if(!S.firstDone){ S.firstDone=true; S.conf[S.round]=conf; }
  // retirar uniones incorrectas
  for(const a of wrongA) delete S.links[a];
  S.retry=wrongA; S.retryB=wrongB.filter(Boolean);
  S.undo=[]; S.sel=null;
  const desc = (id,kind) => kind==='img' ? `la foto de <b>${C[id].name}</b>` : kind==='name' ? `<b>${C[id].name}</b>` : `«${C[id].def}»`;
  if(wrongList.length){
    S.feedback = `<section class="feedback bad"><h3>${wrongList.length===1?'Hay 1 unión incorrecta':'Hay '+wrongList.length+' uniones incorrectas'}. Lee esto antes de volver a unirlas:</h3>
      <ul>${wrongList.map(([a,b])=>`<li><b>${C[a].name}</b>: ${C[a].def}<br><span class="was">Lo habías unido con ${r.b==='img'?'la foto de otro componente':r.b==='name'?'<b>'+C[b].name+'</b>':'otra definición'}.</span></li>`).join('')}</ul></section>`;
    S.wrongFlash={a:wrongA,b:wrongB};
  } else {
    S.feedback = `<section class="feedback good"><h3>${Object.values(S.results[S.round]).every(Boolean)?'¡Perfecto a la primera!':'¡Corregido!'}</h3><p style="margin:0">Todas las parejas de esta ronda están bien.</p></section>`;
  }
  renderMatch();
}

/* ---------- Reflect ---------- */
function commitSession(){
  if(S.committed) return;
  S.committed=true;
  const st=store.modes[S.mode];
  S.prevStars={...st.stars};
  let score=0;
  for(const id of S.ids){
    const ok=[0,1,2].map(r=>!!S.results[r][id]);
    const nOk=ok.filter(Boolean).length; score+=nOk;
    const prev=st.stars[id]||0;
    st.stars[id] = nOk===3 ? Math.min(3,prev+1) : Math.max(0,prev-1);
  }
  S.score=score; S.max=S.ids.length*3; S.secs=Math.round((Date.now()-S.t0)/1000);
  st.history.push({date:new Date().toISOString(), score, max:S.max, secs:S.secs});
  saveStore();
}

function renderReflect(){
  commitSession();
  const st=store.modes[S.mode], n=S.ids.length;
  const errs={}; S.ids.forEach(id=>errs[id]=[0,1,2].filter(r=>!S.results[r][id]).length);
  const over = S.ids.filter(id=>S.pred[id]==='si' && errs[id]>0);
  const under = S.ids.filter(id=>(S.pred[id]==='no'||S.pred[id]==='duda') && errs[id]===0);
  const good = S.ids.filter(id=>(S.pred[id]==='si'&&errs[id]===0)||(S.pred[id]!=='si'&&errs[id]>0)).length;
  const hardest = [...S.ids].sort((a,b)=>errs[b]-errs[a]).filter(id=>errs[id]>0).slice(0,3);
  const mastered = MODES[S.mode].ids.filter(id=>(st.stars[id]||0)>=3).length;
  const all = mastered===MODES[S.mode].ids.length;
  const mm=Math.floor(S.secs/60), ss=String(S.secs%60).padStart(2,'0');
  const attempt = st.history.length;
  const prev = st.history.length>1 ? st.history[st.history.length-2].score : null;
  const orderRows = [...S.ids].sort((a,b)=>errs[b]-errs[a]);

  const roundLines = ROUNDS.map((r,i)=>{
    const ok=Object.values(S.results[i]).filter(Boolean).length;
    return `<li><b>${r.title.split(':')[0]}</b>: dijiste «${CONF[S.conf[i]]}» y acertaste ${ok}/${n} a la primera.</li>`;
  }).join('');

  $app.innerHTML = `${topbar()}
    ${all?`<div class="mastery-banner">¡Maestría conseguida! Tienes tres estrellas en todos los componentes de ${MODES[S.mode].title.toLowerCase()}.${S.mode==='normal'?' ¿Te atreves con «Más difícil todavía»?':''}</div>`:''}
    <h2 style="font-size:clamp(1.8rem,4vw,2.4rem)">Tus resultados</h2>
    <div class="score">
      <span class="big">${S.score}/${S.max}</span>
      <span class="meta">aciertos a la primera<br>Intento nº ${attempt}, ${mm}:${ss} min${prev!==null?`<br>${S.score>prev?`+${S.score-prev} respecto al intento anterior`:S.score===prev?'Igual que el intento anterior':`${S.score-prev} respecto al intento anterior`}`:''}</span>
    </div>
    <div class="grid2">
      <section class="panel">
        <h3>Componente a componente</h3>
        <div class="legend"><span><i></i>Bien a la primera</span><span><i class="x"></i>Fallo (ronda 1, 2, 3)</span><span>★ = estrellas de maestría</span></div>
        <div class="rows">${orderRows.map(id=>{
          const ok=[0,1,2].map(r=>!!S.results[r][id]);
          const s=st.stars[id]||0, p=S.prevStars[id]||0;
          return `<div class="row"><div class="plate">${picAlt(id)}</div>
            <div><div class="nm">${C[id].name}</div><div class="pr">Dijiste: ${PRED[S.pred[id]]}</div></div>
            <div class="marks" aria-label="${ok.filter(Boolean).length} de 3 bien">${ok.map(o=>`<i class="${o?'':'x'}"></i>`).join('')}</div>
            <div class="stars" aria-label="${s} de 3 estrellas${s>p?', has subido':s<p?', has bajado':''}">${starStr(s)}</div></div>`;
        }).join('')}</div>
        <p class="muted" style="font-size:.9rem;margin:12px 0 0">Ganas una estrella por cada intento en que aciertas un componente en las tres rondas. Si lo fallas, pierdes una. Con tres estrellas está dominado.</p>
      </section>
      <div style="display:grid;gap:22px">
        <section class="panel">
          <h3>¿Sabías lo que creías saber?</h3>
          <p class="insight">Tu predicción coincidió con el resultado en <b>${good} de ${n}</b> componentes.</p>
          ${over.length?`<p class="insight"><b>Exceso de confianza:</b> dijiste «Me lo sé» pero fallaste ${over.map(id=>C[id].name).join(', ')}. Son justo los que más conviene repasar.</p>`:''}
          ${under.length?`<p class="insight"><b>Sabes más de lo que crees:</b> dudabas de ${under.map(id=>C[id].name).join(', ')} y no fallaste nada.</p>`:''}
          ${!over.length&&!under.length?`<p class="insight">Te conoces bien: cuando dijiste que lo sabías, lo sabías.</p>`:''}
          <ul style="margin:6px 0 0;padding-left:1.1em">${roundLines}</ul>
        </section>
        <section class="panel">
          <h3>Tu plan para el próximo intento</h3>
          ${hardest.length?`<p class="insight">Lo que más te ha costado: <b>${hardest.map(id=>C[id].name).join(', ')}</b>.</p>`:''}
          <p class="insight muted">¿Qué vas a hacer distinto la próxima vez? Elige una opción.</p>
          <div class="plans">${PLANS.map((p,i)=>`<button class="btn" data-act="plan" data-i="${i}" aria-pressed="${S.planChoice===i}">${p}</button>`).join('')}</div>
        </section>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="again">Intentarlo otra vez</button>
      ${S.mode==='normal'?`<button class="btn" data-act="start" data-mode="hard">Probar «Más difícil todavía»</button>`:`<button class="btn" data-act="start" data-mode="normal">Ir al modo normal</button>`}
      <button class="btn ghost" data-act="home">Volver al inicio</button>
    </div>`;
}

/* ---------- Confirmación propia (los avisos del navegador están bloqueados en la página publicada) ---------- */
function askConfirm(msg, yes, f){
  closeConfirm(); askConfirm._f=f;
  const d=document.createElement('div'); d.className='modal'; d.id='modal'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML=`<div class="box"><p>${msg}</p><div class="row2"><button class="btn" data-act="mno">Cancelar</button><button class="btn primary" data-act="myes">${yes}</button></div></div>`;
  document.body.appendChild(d); d.querySelector('[data-act=mno]').focus();
}
function closeConfirm(){ const m=document.getElementById('modal'); if(m) m.remove(); askConfirm._f=null; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeConfirm(); });

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(act==='start'){ startMode(b.dataset.mode); }
  else if(act==='home'){
    const go=()=>{ clearTimeout(S.gateTimer); S={phase:'home'}; render(); window.scrollTo(0,0); };
    if(S.phase==='study'||S.phase==='match') askConfirm('¿Seguro que quieres salir? Perderás este intento.','Salir', go); else go();
  }
  else if(act==='reset'){
    askConfirm('Se borrarán tus estrellas e intentos de los dos modos. ¿Seguro?','Borrar', ()=>{ try{localStorage.removeItem(KEY);}catch(e){} store=loadStore(); render(); });
  }
  else if(act==='mno'){ closeConfirm(); }
  else if(act==='myes'){ const f=askConfirm._f; closeConfirm(); if(f) f(); }
  else if(act==='pred'){ S.pred[S.ids[S.si]]=b.dataset.v; S.stage='read'; renderStudy(); }
  else if(act==='snext'){
    clearTimeout(S.gateTimer);
    if(S.si<S.ids.length-1){ S.si++; S.stage = S.pred[S.ids[S.si]] ? 'read' : 'predict'; renderStudy(); }
    else { S.phase='match'; S.round=0; setupRound(); renderMatch(); }
    window.scrollTo(0,0);
  }
  else if(act==='sprev'){ clearTimeout(S.gateTimer); S.si--; S.stage='read'; renderStudy(); }
  else if(act==='pick'){ pick(b.dataset.side,b.dataset.id); }
  else if(act==='unsel'){ S.sel=null; renderMatch(); }
  else if(act==='undo'){ if(S.undo.length){ S.links=S.undo.pop(); S.sel=null; renderMatch(); } }
  else if(act==='check'){ check(b.dataset.c||null); }
  else if(act==='nextround'){
    document.getElementById('toast').hidden=true;
    if(S.round<2){ S.round++; setupRound(); renderMatch(); } else { S.phase='reflect'; renderReflect(); }
    window.scrollTo(0,0);
  }
  else if(act==='plan'){
    const i=+b.dataset.i; S.planChoice=i;
    const st=store.modes[S.mode]; st.plan=PLANS[i];
    const last=st.history[st.history.length-1]; if(last) last.plan=PLANS[i];
    saveStore(); renderReflect();
  }
  else if(act==='again'){ startMode(S.mode); }
});

render();
</script>
</body>
</html>
