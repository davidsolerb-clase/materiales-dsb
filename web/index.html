<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiales DSB</title>
  <meta name="description" content="Actividades interactivas de informática y tecnología para la ESO. Abren en el navegador, sin instalar nada.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="envoltorio">
      <p class="ruta">~/materiales-dsb</p>
      <h1>Materiales de informática y tecnología</h1>
    </div>
  </header>

  <main class="envoltorio">
    <form class="filtros" id="filtros" role="search">
      <label class="buscar">
        <span class="sr">Buscar</span>
        <input id="q" name="q" type="search" placeholder="Buscar…" autocomplete="off">
      </label>
      <fieldset class="chips" id="asignatura"><legend>Asignatura</legend></fieldset>
      <fieldset class="chips" id="curso"><legend>Curso</legend></fieldset>
    </form>

    <p class="recuento" id="recuento" aria-live="polite"></p>
    <ul class="rejilla" id="rejilla"></ul>
    <p class="vacio" id="vacio" hidden></p>
  </main>

  <footer class="pie">
    <div class="envoltorio">
      <p>Materiales de David Soler con licencia <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es">CC BY-SA 4.0</a>. Úsalos, adáptalos y compártelos citando la autoría.</p>
      <p><a href="https://github.com/davidsolerb-clase/materiales-dsb">Código en GitHub</a></p>
    </div>
  </footer>

  <script>window.CATALOGO = /*CATALOGO*/;</script>
  <script src="portada.js"></script>
</body>
</html>
